spring.application.name=miTienda

spring.datasource.url=jdbc:postgresql://localhost:5432/miTiendaDEV
#spring.datasource.url=jdbc:postgresql://localhost:5432/miTiendaQA
#spring.datasource.url=jdbc:postgresql://localhost:5432/miTiendaPROD
spring.datasource.username=postgres
spring.datasource.password=sasa
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

spring.main.allow-bean-definition-overriding=true


# Configuración básica de JPA/Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true



spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

logging.file.path=/app/miTienda/DEV/logs
#logging.file.path=/app/miTienda/QA/logs
#logging.file.path=/app/miTienda/PROD/logs
logging.level.root=INFO

precio.tecnico=40
precio.pg=90
porcentaje.tecnico=.20f
porcentaje.pg=1.4f

mensaje.venta=No retirar ni levantar micas No borrar ni retirar sellos Sin pegamento Sin danos en cristal ni LCD/OLED, 5 dias de garantia Consevando el ticket

garantia.dias=5

app.pricing.strategy.bean=margenFijoStrategy
#app.pricing.strategy.bean=margenPorcentualStrategy

##CONFIGURACION PARA ANALISIS DE VENTAS
app.unidades.vendidas.analisis=2